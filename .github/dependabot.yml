version: 2
updates:
  # Dependensi npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Kelompokkan update minor/patch agar tidak membanjiri PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Jangan buka PR untuk major version bump otomatis — berpotensi breaking (mis. Prisma 7,
      # TypeScript 7, ESLint 10). Upgrade major dilakukan manual & terverifikasi. Patch keamanan
      # tetap masuk lewat security updates (di luar aturan ignore ini).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Action di-SHA-pin sengaja; jangan lompat major otomatis. Dependabot tetap boleh
      # memperbarui SHA untuk minor/patch (keamanan) tanpa mengganti versi major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
