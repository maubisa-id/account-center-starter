name: Release

on:
  push:
    tags: ["v*"]

# Hanya butuh menulis Release (contents). Tak ada trigger dari kontributor luar.
permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Pakai gh CLI bawaan runner (bukan action pihak-3) — supply chain paling aman.
      # GITHUB_TOKEN default cukup untuk membuat Release di repo yang sama.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
