name: Dependency Review

# Pelengkap "code security" repo ini (CodeQL default setup + Dependabot): menggagalkan PR
# yang memasukkan dependency baru dengan kerentanan diketahui (severity >= high) atau lisensi
# yang tidak diizinkan, SEBELUM ter-merge ke main. Berjalan hanya pada pull_request (trigger
# non-privilege), jadi tak ada akses secret dari kontributor luar.
on:
  pull_request:
    branches: [main]

# Default deny; hanya baca kode di level atas.
permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # hanya untuk menempel ringkasan hasil di PR
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
